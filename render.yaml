services:
  - type: web
    name: gg-maidan-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # You will enter this manually in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: gg-maidan-db
          property: connectionString

databases:
  - name: gg-maidan-db
    plan: free
